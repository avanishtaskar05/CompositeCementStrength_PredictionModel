[project]
name = "compositecementstrength-predictionmodel"
version = "1.0.0"
description = "This is a Regression Model"
readme = "README.md"
authors = [
    { name = "avanishtaskar05", email = "avanishtaskar05@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
compositecementstrength-predictionmodel = "compositecementstrength_predictionmodel:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
